<div class="container">
  <h1>The Antebellum Period</h1>
  <p>America's Antebellum period spanned the years between the end of the War of 1812 (1815) and the start of the Civil War (1861). </p>
  <h2>Ask Auntie Bell</h2>
  <p>Enter a year from American history to check whether it is part of the Antebellum period. </p> 
  <div id="pre">
  <!-- Add an input for the year -->
  <input type="number" class="input" id="year" placeholder="Enter a year" min="1620" max="2024">
  
  <!-- Add a button to check the year -->
  <button class="button pre" id="check">Check</button>
  </div>

<script>
  // Get the input, button, and output elements
  var input = document.getElementById("year");
  var button = document.getElementById("check");
  var output = document.getElementById("result");
  var abno = document.getElementById("auntieBell-no"); 
  var abyes = document.getElementById("auntieBell-yes"); 

  // Add a click event listener to the button
  button.addEventListener("click", function () {
    //pre.style.display = 'none';
    //post.style.display = 'block';

    // Get the value of the input
    var year = input.value;

    // Validate the input
    if (year >= 1620 && year <= 2024) {
      // Check if the year is antebellum or not
      if (year >= 1815 && year <1861) {
        // Set the output to antebellum
        output.innerHTML = year+ " is Antebellum";
        abyes.style.display = 'block'; 
        abno.style.display = 'none'; 
      } else if (year ==1861) {
        // Set the output to antebellum
        output.innerHTML = year+" is Partly Antebellum";
        abyes.style.display = 'block'; 
        abno.style.display = 'none'; 
      }else {
        // Set the output to not antebellum
        output.innerHTML = year+ " Is Not antebellum";
        abyes.style.display = 'none'; 
        abno.style.display = 'block'; 

      }
    } else {
      // Set the output to invalid input
      output.innerHTML = "Invalid input";
        abyes.style.display = 'none'; 
        abno.style.display = 'block'; 

    }
    
    // Clear the input
    input.value = "";
    
    // Focus on the input
    // input.focus();
    
  });
</script>
